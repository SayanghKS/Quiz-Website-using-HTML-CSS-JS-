<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Featured Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="quiz-container">
        <h1>Quiz App</h1>
        <div id="progress">Question 1 of 10</div>
        <div id="timer">Time left: 15s</div>

        <div id="question-container">
            <h2 id="question">Question text here</h2>
            <ul id="options"></ul>
        </div>

        <button id="next-btn" class="hide">Next</button>
        <div id="result" class="hide"></div>
        <button id="restart-btn" class="hide">Restart</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
